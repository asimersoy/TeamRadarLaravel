name: qguard-dev
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: development
  image: qguard-app:development
  restart: unless-stopped
  working_dir: /app
  volumes:
    - .:/app
  environment: &environment
    APP_NAME: QGuard
    APP_ENV: local
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Run node scripts/init-env.mjs}
    APP_URL: http://localhost:8120
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: qguard
    DB_USERNAME: qguard
    DB_PASSWORD: ${DB_PASSWORD:?Run node scripts/init-env.mjs}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: qguard-dev
    REVERB_APP_KEY: ${REVERB_APP_KEY:?Run init-env}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Run init-env}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SCALING_ENABLED: "false"
    MAIL_MAILER: smtp
    MAIL_HOST: mail
    MAIL_PORT: 1025
    MAIL_FROM_ADDRESS: hello@qguard.test
    QGUARD_PUBLIC_ENABLED: "false"
  depends_on:
    postgres:
      condition: service_healthy
services:
  app:
    <<: *app
  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports: ["127.0.0.1:8120:80"]
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  postgres:
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: qguard
      POSTGRES_USER: qguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run init-env}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qguard -d qguard"]
      interval: 2s
      timeout: 5s
      retries: 30
  worker:
    <<: *app
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=60
  scheduler:
    <<: *app
    command: php artisan schedule:work
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["127.0.0.1:8122:8080"]
  mail:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:8123:8025"]
  node:
    image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
    profiles: [tools]
    working_dir: /app
    volumes: [".:/app"]
    entrypoint: ["npm"]
volumes:
  postgres-data:
    name: qguard-dev-postgres
