body[data-theme=refined] h1{font-weight:750;letter-spacing:-1.9px}body[data-theme=refined] .brand-mark{color:#c9e99b}body[data-theme=refined] .public-nav .brand-mark{color:var(--accent)}body[data-theme=refined] .nav a.active{background:#c9e99b;color:#183c2f}body[data-theme=refined] .sidebar{border-color:#24473e}body[data-theme=refined] .sidebar-tip{border-color:#365047}body[data-theme=refined] .sidebar .avatar{background:#315045;color:#ebf4e3}body[data-theme=refined] .sidebar .brand small{color:#b5c8bb}body[data-theme=refined] .queue-card{border-top:3px solid #8bab68}body[data-theme=refined] .notice.warn{background:#fffdf5}body[data-theme=refined] .notice.error{background:#fff6f4}body[data-theme=refined] .headline-accent{color:#47735d}body[data-theme=refined] .hero-roster{box-shadow:16px 18px 0 #e2e9da}body[data-theme=refined] .auth-intro{background:radial-gradient(ellipse at bottom left,#305742,transparent 70%),var(--nav)}body[data-theme=refined] .auth-intro .eyebrow{color:#c9e99b}body[data-theme=refined] .rank-icon{border-color:#a7bd89;color:#3f644a}body[data-theme=refined] .pill.accent{color:#2b593e}body[data-theme=refined] .roster-row .avatar{background:#e7eddf}body[data-theme=refined] .roster-row:nth-child(3n) .avatar{background:#eee5d4;color:#765a2e}body[data-theme=refined] .roster-row:nth-child(4n) .avatar{background:#e1e8ee;color:#385c70}body[data-theme=refined] .feedback-summary .metric{color:var(--accent)}body[data-theme=refined] .public-shell{background:radial-gradient(ellipse at 85% 20%,#e6eddd,transparent 55%)}body[data-theme=refined] .card-head h2{letter-spacing:-.7px}

.rating-fieldset{border:0;padding:0;margin:0;min-width:0}.rating-fieldset legend{font-weight:700;margin-bottom:8px}.range-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:15px}.descriptor-status{margin-top:8px}.descriptor input[data-touched=false]{opacity:.45}.summary-scale{height:auto;background:none;margin:25px 0}.summary-scale:after{display:none}.progress-track i{display:block;height:100%;background:var(--accent)}.chat-message{font-size:12px;padding:10px;background:var(--bg);border-radius:6px;overflow-wrap:anywhere}.chat-message small{font-size:9px;color:var(--muted)}.chat-message.own{background:var(--soft)}.chat-message p{margin:5px 0}.party-code{display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:left;letter-spacing:1px}.party-code strong{overflow-wrap:anywhere;font-size:28px}.party-code .metric-label{letter-spacing:1px}.party-code .btn{letter-spacing:0}.radar-node{width:64px;height:64px;display:grid;place-items:center;border:0;border-radius:18px;position:static;background:var(--soft);font-size:23px;font-weight:800}.radar i{display:none}.roster-heading{font-size:9px;color:var(--muted);font-weight:700}.catalog-card p{font-size:12px;color:var(--muted)}.catalog-card h3 a{display:flex;align-items:center;justify-content:space-between}.evidence{margin-left:0;margin-right:0}td small{display:block;color:var(--muted);margin-top:5px}.brand-mark{flex-shrink:0}#main:focus{outline:none}.card .row.between{flex-wrap:wrap}.mini-member .pill{margin-left:auto}.rating-card{margin-bottom:0}

<body data-theme="wire">
  <a class="skip" href="#main" data-action="skip-content">Skip to content</a>
  <div class="review-bar" aria-label="Design review controls">
    <span><strong>DESIGN PREVIEW</strong><span class="review-note"> · Fictional data. No live services.</span></span>
    <div class="review-actions">
      <label class="sr-only" for="theme">Visual version</label>
      <select id="theme"><option value="wire">01 · Wireframe</option><option value="concept">02 · Concept</option><option value="refined">03 · Refined</option></select>
      <a href="#review">All screens</a><button data-action="reset-demo" class="text-button">Reset sample</button>
    </div>
  </div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <script>
/* Local design artifact. All identities, state and actions are fictional. No network calls. */
(() => {
  'use strict';
  const app = document.querySelector('#app');
  const dialog = document.querySelector('#dialog');
  const storageKey = 'qguard_design_review_v1';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const peers = [
    {id:'mina',name:'Mina',tag:'Mina#DEMO',initials:'MI',rank:'Gold II',honor:'69.2'},
    {id:'atlas',name:'Atlas',tag:'Atlas#DEMO',initials:'AT',rank:'Gold III',honor:'67.8'},
    {id:'vega',name:'Vega',tag:'Vega#DEMO',initials:'VE',rank:'Gold I',honor:'70.1'},
    {id:'rune',name:'Rune',tag:'Rune#DEMO',initials:'RU',rank:'Gold II',honor:'68.9'}
  ];
  const ranks=['Iron I','Iron II','Iron III','Bronze I','Bronze II','Bronze III','Silver I','Silver II','Silver III','Gold I','Gold II','Gold III','Platinum I','Platinum II','Platinum III','Diamond I','Diamond II','Diamond III','Ascendant I','Ascendant II','Ascendant III','Immortal I','Immortal II','Immortal III','Radiant'];
  const fresh = () => ({name:'Ari',rank:'Gold II',observed:'Gold II',region:'Europe',language:'English',linked:true,confirmed:false,owed:false,ended:false,joined:false,code:'',ratings:{},descriptors:{},drafts:{},party:['Ari'],partyReady:false,sessionType:'solo',premadeIds:[],friends:['Mina','Vega'],requests:['Atlas'],outgoing:[],messages:[],reviewed:false,adminNotes:[],reportSent:false,queueStarted:null});
  let state;
  try{state={...fresh(),...JSON.parse(localStorage.getItem(storageKey)||'null')};}catch{state=fresh();}
  const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{}};
  const reset=()=>{state=fresh();save();};
  let page='dashboard',variant='',toastTimer,returnFocus;
  const screens=[
    ['review','Review catalog','All routes and sample scenarios',[]],
    ['welcome','Welcome','Product introduction',[]],['login','Sign in','Account and guest entry',['invalid']],
    ['register','Create account','Open registration',['duplicate']],['verify','Verify email','Verification states',['expired','throttled']],
    ['forgot','Recover account','Request a reset',['sent','throttled']],['reset','Reset password','New password',['expired']],
    ['setup','Player setup','Handle and queue defaults',[]],['connect','Riot connection','Consent and availability',['linked','declined','failed']],
    ['dashboard','Matchmaking','Main player workspace',['unlinked','feedback-due']],['rank','Confirm rank','Observed and declared rank',['loading','corrected','unavailable','unplaced']],
    ['party','Your party','Solo, premade and readiness',['partial','full','invitation','stale','non-owner']],['friends','Connections','Exact lookup and requests',['empty','not-found']],
    ['queue','Finding teammates','Waiting and cancellation',['error','offline','formed']],['team','Your five','Code, roster and private text',['recipient','code-ready','offline','ready','no-show','acknowledge']],
    ['discrepancy','Check a teammate','Account/rank corroboration',['waiting','excluded','cleared']],['disbanded','Team disbanded','Reason and requeue',['no-show']],
    ['history','Session history','Participant-only sessions',['empty']],['session','Session detail','Required and optional feedback',['partial','complete','premade','full-premade','disbanded']],
    ['report','Report conduct','Private evidence and receipt',['submitted']],['profile','Your profile','Own honor and descriptions',['new','teammate']],
    ['settings','Account settings','Identity and preferences',['queued']],['security','Account security','Password and sign out',[]],
    ['admin','Report inbox','Cleared-admin sample',['empty']],['case','Report detail','Evidence and review',['excluded','stale']],
    ['error','Recovery screens','Access and failure',['denied','expired','offline','policy']]
  ];
  const icon=(name)=>{const paths={match:'M3 6h18M3 12h12M3 18h8',history:'M3 12a9 9 0 1 0 3-7M3 3v5h5M12 7v6l4 2',friends:'M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M2 21v-3a6 6 0 0 1 12 0v3M16 4a4 4 0 0 1 0 8M17 15a5 5 0 0 1 5 5',user:'M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10M3 22v-2a9 9 0 0 1 18 0v2',gear:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',arrow:'M4 12h16M14 6l6 6-6 6',check:'M4 12l5 5L20 6'};return `<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[name]||paths.match}"/></svg>`;};
  const brand=()=>'<a class="brand" href="#welcome" aria-label="QGuard home"><i class="brand-mark" aria-hidden="true"></i><span>QGuard<small>GOOD COMPANY. GOOD GAMES.</small></span></a>';
  const avatar=(name,cls='')=>`<span class="avatar ${cls}" aria-hidden="true">${esc(name.slice(0,2).toUpperCase())}</span>`;
  const pill=(text,cls='')=>`<span class="pill ${cls}">${esc(text)}</span>`;
  const btn=(text,action,cls='',attrs='')=>`<button class="btn ${cls}" data-action="${action}" ${attrs}>${text}</button>`;
  const link=(text,route,cls='')=>`<a class="btn ${cls}" href="#${route}">${text}</a>`;
  const note=(title,text,cls='')=>`<div class="notice ${cls}"><strong>${title}</strong>${text}</div>`;
  const head=(title,desc='',eyebrow='YOUR NEXT SESSION',action='')=>`<header class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${action}</header>`;
  const options=(items,value)=>items.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('');
  const field=(label,name,type='text',value='',extra='')=>`<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
  const select=(label,name,items,value)=>`<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${options(items,value)}</select></div>`;
  const errorSlot=()=>'<div class="form-error" role="alert"></div>';
  const empty=(title,text,action='')=>`<div class="empty-state"><div class="empty-symbol" aria-hidden="true">＋</div><h2>${title}</h2><p>${text}</p>${action?`<div class="button-row" style="justify-content:center">${action}</div>`:''}</div>`;
  const demo=(text,button='')=>`<div class="demo-hint">REVIEW SCENARIO · ${text} ${button}</div>`;
  const eligible=()=>state.sessionType==='full-premade'?[]:peers.filter(x=>!(state.premadeIds||[]).includes(x.id));
  const remaining=()=>eligible().filter(x=>!state.ratings[x.id]).length;
  const debt=()=>state.owed&&remaining()>0;
  const go=route=>{location.hash=route;};
  function toast(text){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=text;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),4200);}
  function modal(title,text,confirmLabel,confirmAction){returnFocus=document.activeElement;dialog.innerHTML=`<h2 id="dialog-title">${title}</h2><p>${text}</p><div class="button-row end">${btn('Keep editing','close-dialog','secondary')}${btn(confirmLabel,confirmAction)}</div>`;dialog.showModal();dialog.querySelector('button').focus();}
  function closeDialog(){dialog.close();returnFocus?.focus();}
  dialog.addEventListener('close',()=>returnFocus?.focus());
  const navigation=[['dashboard','Matchmaking','match'],['history','Sessions','history'],['friends','Connections','friends'],['profile','My profile','user'],['settings','Settings','gear']];
  function shell(content){const active=({rank:'dashboard',party:'dashboard',queue:'dashboard',team:'dashboard',discrepancy:'dashboard',disbanded:'dashboard',session:'history',report:'history',security:'settings'})[page]||page;return `<div class="app-shell"><aside class="sidebar">${brand()}<div class="nav-label">PLAY TOGETHER</div><nav class="nav" aria-label="Main navigation">${navigation.map(([route,title,sym])=>`<a href="#${route}" class="${active===route?'active':''}" ${active===route?'aria-current="page"':''}>${icon(sym)}${title}${route==='history'&&debt()?'<span class="count">1</span>':''}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-tip">Find your people.<br>Make the next game better.</div><div class="self-mini">${avatar(state.name)}<div><strong>${esc(state.name)}</strong><div class="small" style="opacity:.6">Sample player</div></div></div></div></aside><main id="main" class="main-area" tabindex="-1"><div class="topline"><span>QGUARD <span aria-hidden="true">/</span> ${esc(screens.find(x=>x[0]===page)?.[1]||'Review')}</span><span><i class="status-dot"></i> PC · VALORANT</span></div>${content}<footer class="footer"><span>Better company, one session at a time.</span><a href="#review">Review this prototype</a></footer></main></div>`;}
  function auth(title,desc,body){return `<div class="auth-shell"><aside class="auth-intro">${brand()}<div><div class="eyebrow">FIND YOUR FIVE</div><h1>Same game.<br>Better company.</h1><p>Meet teammates with similar honor. Play together, then help shape the next session.</p></div><div class="small">QGuard honor reflects teammate feedback, not game skill.</div></aside><main id="main" class="auth-content" tabindex="-1"><div class="auth-form"><div class="eyebrow">WELCOME TO QGUARD</div><h1>${title}</h1><p>${desc}</p>${body}<p class="demo-hint">Local design preview. Use fictional details only. Nothing is sent.</p></div></main></div>`;}
  function connections(){return `<aside class="card connections"><div class="card-head"><h3>Your connections</h3><a href="#friends" class="small link-inline">Manage</a></div>${state.friends.length?state.friends.map(name=>`<div class="mini-member">${avatar(name)}<div><strong>${esc(name)}</strong><small>QGuard friend</small></div><button class="text-button" data-action="invite-friend" data-name="${esc(name)}">Invite</button></div>`).join(''):'<p class="muted small">Add someone by their exact QGuard handle.</p>'}<div class="divider"></div><p class="small muted">A QGuard connection does not add anyone to your Riot friends.</p>${state.requests.length?`<a href="#friends" class="btn secondary full" style="margin-top:18px">${state.requests.length} pending request</a>`:''}</aside>`;}
  function steps(index){return `<div class="flow-steps">${['Confirm rank','Find teammates','Join the party','Play & reflect'].map((t,i)=>`<span class="${i===index?'current':''}">${i+1} · ${t}</span>`).join('')}</div>`;}
  function ratingSummary(){return `<div class="grid-2"><div><div class="metric-label">YOUR HONOR</div><div class="metric">68.4<small>/ 100</small></div></div><div><div class="metric-label">GAME RANK</div><div class="rank-value">${esc(state.rank)}</div><p class="small muted">Confirm before every queue</p></div></div>`;}
  function showWelcome(){return `<div class="public-shell"><nav class="public-nav">${brand()}<div class="row"><a href="#login" class="small">Sign in</a>${link('Get started','register')}</div></nav><main id="main" tabindex="-1"><section class="hero"><div><div class="eyebrow">YOUR GAME. YOUR KIND OF TEAM.</div><h1>Good games start<br>with good<br><span class="headline-accent">teammates.</span></h1><p>Find a five-player VALORANT group with similar honor. Less searching for a team. More time playing together.</p><div class="button-row">${link('Find your five '+icon('arrow'),'register')}${btn('Explore as a guest','guest','secondary')}</div><p class="small muted">A sample walkthrough is available while Riot sign-in is being prepared.</p></div><div class="hero-roster"><div class="row between"><div class="eyebrow">A GOOD MATCH, BEYOND RANK</div>${pill('5 / 5','accent')}</div><h2>Your next team.</h2>${[{name:'Ari',rank:'Gold II',honor:'68.4'},...peers].map(p=>`<div class="roster-row">${avatar(p.name)}<strong>${p.name}</strong><span>${p.rank}</span><strong>${p.honor}</strong></div>`).join('')}<div class="demo-hint">Illustrative roster · Rank and honor are different signals.</div></div></section><section class="grid-3"><article class="card"><div class="eyebrow">01 / FIND</div><h2>People, not listings.</h2><p class="muted small" style="margin-top:12px">Join solo or with friends. QGuard forms your five around compatible settings and nearby honor.</p></article><article class="card"><div class="eyebrow">02 / PLAY</div><h2>A clear way in.</h2><p class="muted small" style="margin-top:12px">One player shares the party code. Everyone knows the next step, with a private text room to coordinate.</p></article><article class="card"><div class="eyebrow">03 / REFLECT</div><h2>Every session matters.</h2><p class="muted small" style="margin-top:12px">Rate your teammates' conduct after playing. Your received individual ratings and reviewers stay private.</p></article></section></main><footer class="footer"><span>QGuard · Independent teammate matching</span><a href="#review">About this review</a></footer></div>`;}
  function showLogin(){return auth('Welcome back.','Your next team is a few steps away.',`<form data-form="login" novalidate>${field('Email','email','email','','autocomplete="off" placeholder="player@example.invalid"')}${field('Password','password','password','','autocomplete="off"')}${errorSlot()}<button class="btn full" type="submit">Sign in</button></form><div class="row between small" style="margin-top:16px"><a href="#forgot" class="link-inline">Forgot password?</a><a href="#register" class="link-inline">Create account</a></div><div class="auth-divider">OR EXPLORE QGUARD</div>${btn('Continue as guest '+icon('arrow'),'guest','secondary full')}<p class="small muted" style="margin-top:12px">Try the complete experience with sample players. No Riot account needed for this preview.</p>${variant==='invalid'?note('Check your details','The email or password is incorrect. Try again or reset your password.','error'):''}`);}
  function showRegister(){return auth('Find your people.','Create your QGuard account. Registration is open.',`<form data-form="register" novalidate>${field('QGuard handle','handle','text','','placeholder="Choose a handle" maxlength="24"')}${field('Email','email','email','','placeholder="player@example.invalid" autocomplete="off"')}${field('Password','password','password','','autocomplete="off"')}${errorSlot()}<button class="btn full" type="submit">Create account</button></form>${variant==='duplicate'?note('This handle is taken','Choose another QGuard handle.','error'):''}<p class="small muted" style="margin-top:18px">Already have an account? <a href="#login" class="link-inline">Sign in</a></p><p class="small muted"><a href="#error?state=policy" class="link-inline">Review draft privacy and policy status</a></p><p class="small muted" style="margin-top:14px">Account registration and Riot linking are separate. Matchmaking needs your Riot connection.</p>`);}
  function showVerify(){return auth('Check your inbox.','We sent a verification link to your sample email.',`${note(variant==='expired'?'This link has expired.':'One more step.',variant==='expired'?'Request a new link to finish verification.':'Open the email to verify your address. Check your spam folder if it has not arrived.')}<div class="button-row">${btn(variant==='throttled'?'Try again shortly':'Resend email','resend','secondary full',variant==='throttled'?'disabled':'')}</div>${demo('No email is sent in this prototype.',btn('Open sample verified state','verified','small-btn'))}<a href="#login" class="small link-inline">Back to sign in</a>`);}
  function showForgot(){if(variant==='throttled')return auth('Try again shortly.','A reset link was requested recently.',note('Please wait before another request','This is a sample rate-limit state. No email was sent.')+link('Back to sign in','login','secondary'));return auth('Let’s get you back.','Request a password reset link.',`${variant==='sent'?note('Check your inbox','If an account exists for that email, a reset link will arrive shortly.'):`<form data-form="forgot" novalidate>${field('Email','email','email','','placeholder="player@example.invalid"')}${errorSlot()}<button class="btn full">Send reset link</button></form>`}<div class="button-row">${link('Back to sign in','login','secondary')}</div>${demo('Review the next screen without sending email.',link('Sample reset screen','reset','small-btn secondary'))}`);}
  function showReset(){return auth('A fresh start.','Choose a new password for your sample account.',variant==='expired'?`${note('Reset link expired','Request another reset link.','warn')}${link('Request a new link','forgot','full')}`:`<form data-form="password" novalidate>${field('New password','new-password','password','','autocomplete="off"')}${field('Confirm new password','confirm-password','password','','autocomplete="off"')}${errorSlot()}<button class="btn full">Save new password</button></form>`);}
  function showSetup(){return shell(`${head('Make yourself at home.','A few details help us find compatible teammates.','PLAYER SETUP')}<div class="workspace"><form class="card" data-form="setup" novalidate><div class="card-head"><h2>Your player profile</h2>${pill('1 of 2')}</div>${field('QGuard handle','handle','text',state.name,'maxlength="24"')}<p class="small muted" style="margin:-10px 0 20px">Teammates see this handle. Your email stays private.</p><div class="grid-2">${select('Game region','region',['Europe','North America','Asia Pacific'],state.region)}${select('Team language','language',['English','Türkçe','Español'],state.language)}</div>${errorSlot()}<button class="btn">Continue to Riot connection ${icon('arrow')}</button></form><div class="card"><h3>One team. A common language.</h3><p class="small muted" style="margin-top:12px">We keep your region and team language consistent when matching. You can change these defaults in settings.</p><div class="divider"></div><p class="small muted">VALORANT · PC · Competitive<br>Five players per session.</p></div></div>`);}
  function showConnect(){const linked=variant==='linked';return shell(`${head('Connect your game identity.','Your QGuard account and Riot account serve different purposes.','PLAYER SETUP')}<div class="workspace"><section class="card"><div class="card-head"><h2>Riot account</h2>${pill(linked?'Connected':'Not connected',linked?'accent':'')}</div>${linked?`<div class="row">${avatar(state.name,'large')}<div><h2>${esc(state.name)}#DEMO</h2><p class="muted small">Sample linked identity</p></div></div><div class="button-row">${link('Continue to matchmaking','dashboard')}</div>`:`${note(variant==='declined'?'Connection declined':variant==='failed'?'Could not connect':'Riot sign-in is not available yet',variant==='declined'?'Your account has not been linked. You can return when you are ready.':variant==='failed'?'Your QGuard account is safe. Retry when the connection is available.':'Normal matchmaking will open after Riot access is approved and sign-in is integrated.',variant==='failed'?'error':'')}<div class="divider"></div><h3>When you connect</h3><ol class="step-list" style="margin-top:20px"><li><span class="step-number">1</span><div><strong>Sign in on Riot’s own page</strong><p>QGuard will never ask for your Riot password.</p></div></li><li><span class="step-number">2</span><div><strong>Choose to share your game data</strong><p>We use your identity and available match rank, with a confirmation before every queue.</p></div></li><li><span class="step-number">3</span><div><strong>Return to your QGuard profile</strong><p>Teammates see the account and rank declared for your session.</p></div></li></ol>${demo('This button supplies a fictional identity. It does not open Riot.',btn('Use sample Riot connection','sample-connect','small-btn'))}`}</section><section class="card"><div class="eyebrow">CLEAR SOURCES</div><h3>Rank is checked with you.</h3><p class="muted small" style="margin-top:12px">The latest available match may not reflect your rank right now. You always confirm it or correct it before joining matchmaking.</p></section></div>`);}
  function showDashboard(){const unlinked=variant==='unlinked'||!state.linked;const owed=variant==='feedback-due'||debt();return shell(`${head('Find your next five.','A team built around compatible ranks, shared language and similar honor.','WELCOME BACK, '+esc(state.name.toUpperCase()))}<div class="workspace"><div class="stack">${owed?note('A little feedback before your next game.','Your previous session is waiting for your ratings. Finish them, then find your next team.','warn'):''}${unlinked?note('Connect Riot to use matchmaking.','You can explore the sample experience while live Riot sign-in is unavailable.'):''}<section class="card queue-card"><div class="card-head"><div class="row"><span class="rank-icon"><span>V</span></span><div><h2>VALORANT</h2><p class="muted small">Competitive · PC</p></div></div>${pill('Five-player session','accent')}</div><div class="grid-2"><div class="split-stat"><span class="muted">Region</span><strong>${esc(state.region)}</strong></div><div class="split-stat"><span class="muted">Team language</span><strong>${esc(state.language)}</strong></div></div><div class="divider"></div><div class="row between"><h3>Your party</h3><a class="small link-inline" href="#party">Manage party</a></div><div class="slots" style="margin-top:20px">${Array.from({length:5},(_,i)=>`<div>${state.party[i]?avatar(state.party[i]):'<div class="empty-slot">＋</div>'}<div class="slot-label">${i===0?'You':state.party[i]?esc(state.party[i]):'Open'}</div></div>`).join('')}<span class="muted small" style="margin-left:auto">${state.party.length} / 5</span></div><div class="divider"></div>${btn((owed?'Finish session feedback':unlinked?'Connect your Riot account':'Find match')+' '+icon('arrow'),'find-match','full')}<p class="small muted center" style="margin-top:12px">${owed?'Your ratings stay private.':unlinked?'Guest review uses fictional accounts.':'We’ll check your rank before you enter the queue.'}</p></section><section class="card">${ratingSummary()}<div class="divider"></div><p class="small muted">Honor reflects teammate feedback. It is separate from your VALORANT skill rank.</p></section><a href="#history" class="notice"><strong>Pick up where you left off ${icon('arrow')}</strong>Your sessions, teammates and feedback in one place.</a></div>${connections()}</div>`);}
  function showRank(){const unavailable=variant==='unavailable',loading=variant==='loading',unplaced=variant==='unplaced',corrected=variant==='corrected';return shell(`${head('Does this look right?','Confirm your current Competitive rank before this matchmaking attempt.','RANK CHECK')}${steps(0)}<div class="workspace"><form data-form="rank" class="card" novalidate><div class="card-head"><h2>Your VALORANT rank</h2>${pill('Riot account · sample')}</div>${loading?note('Checking available match data…','This screen represents the retrieval state.'):unavailable?note('Latest rank is unavailable','Retry the check, or declare your current rank. We’ll keep the source clear.','warn'):unplaced?note('No placed rank yet','This Competitive queue needs a placed rank. Finish your placements in VALORANT first.','warn'):`<div class="row" style="padding:12px 0 20px"><span class="rank-icon"><span>G</span></span><div><div class="metric-label">LAST OBSERVED IN MATCH DATA</div><div class="rank-value">${esc(state.observed)}</div><p class="small muted">Sample ranked game · Yesterday, 21:15</p></div></div>`}<div class="divider"></div>${select('Your current rank for this session','rank',ranks,corrected?'Gold III':state.rank)}<p class="small muted">Changed since that game? Choose the correct rank. Your declaration stays separate from the observed value.</p><label class="check-label"><input type="checkbox" name="confirmed"><span>I confirm this is my current rank and this account can play Competitive.</span></label>${errorSlot()}<div class="button-row"><button class="btn" ${loading||unplaced?'disabled':''}>Confirm rank & continue ${icon('arrow')}</button>${btn('Check again','retry-rank','secondary')}</div>${loading?demo('Preview a completed sample response.',btn('Show rank result','show-rank','small-btn secondary')):''}</form><div class="card"><h3>Why ask every time?</h3><p class="muted small" style="margin-top:12px">Your rank can change between sessions. Match data may also lag behind your current rank.</p><div class="divider"></div><ol class="step-list"><li><span class="step-number">1</span><div><strong>We retrieve</strong><p>Latest available ranked-match tier.</p></div></li><li><span class="step-number">2</span><div><strong>You confirm</strong><p>Your rank for this queue attempt.</p></div></li><li><span class="step-number">3</span><div><strong>Your team checks</strong><p>Accounts and ranks in the game lobby.</p></div></li></ol></div></div>`);}

  function showParty(){const members=variant==='full'?[state.name,...peers.map(p=>p.name)]:variant==='partial'?[state.name,'Vega']:state.party;return shell(`${head('Bring your people.','Join solo, or keep your premade together while we find the rest.','YOUR PARTY')}${variant==='stale'?note('This invitation has expired','Ask your friend for another invitation.','warn'):variant==='invitation'?note('Vega invited you to a party',btn('Accept invitation','accept-party','small-btn')+' '+btn('Decline','decline-party','small-btn secondary')):''}<div class="workspace"><div class="stack"><section class="card"><div class="card-head"><h2>Your party</h2>${pill(members.length+' / 5')}</div>${members.map((n,i)=>`<div class="mini-member">${avatar(n)}<div><strong>${esc(n)} ${i===0?'(you)':''}</strong><small>${i===0?'Party owner':'Premade teammate'}</small></div>${pill(i===0?(state.partyReady?'Ready':'Not ready'):'Ready',i===0&&!state.partyReady?'':'accent')}</div>`).join('')}<div class="divider"></div><p class="small muted">Everyone confirms their own rank and finishes prior feedback before becoming ready. The owner starts the queue once everyone is ready.</p><div class="button-row">${btn(state.partyReady?'Ready ✓':'Confirm rank & get ready','party-ready',state.partyReady?'secondary':'')}${variant==='non-owner'?pill('Waiting for owner'):btn(members.length===5?'Create our session':'Find remaining teammates','party-queue','secondary')}${btn('Leave party','leave-party','ghost')}</div></section>${note('Your party stays together','We do not split premades. People who entered together cannot rate each other for this session.')}</div>${connections()}</div>`);}
  function showFriends(){const friends=variant==='empty'?[]:state.friends;return shell(`${head('Good company, again.','Your QGuard connections. Game friendships are separate.','CONNECTIONS')}<div class="workspace"><div class="stack"><form data-form="friend" class="card" novalidate><h2>Find a friend</h2><p class="muted small" style="margin:10px 0 20px">Enter their exact QGuard handle.</p>${field('QGuard handle','friend-handle','text','','placeholder="Try Rune"')}${errorSlot()}${variant==='not-found'?note('No matching player','Check the exact QGuard handle and try again.','warn'):''}<button class="btn">Send request</button>${state.outgoing.length?`<p class="small muted" style="margin-top:14px">Pending: ${state.outgoing.map(esc).join(', ')}</p>`:''}</form><section class="card"><h2>Your friends</h2>${friends.length?friends.map(n=>`<div class="mini-member">${avatar(n)}<div><strong>${esc(n)}</strong><small>QGuard friend</small></div>${btn('Invite','invite-friend','small-btn secondary',`data-name="${esc(n)}"`)}${btn('Remove','remove-friend','small-btn ghost',`data-name="${esc(n)}"`)}</div>`).join(''):empty('Start with a connection.','Find someone by their exact handle to send a request.')}</section></div><aside class="card"><h3>Requests</h3>${state.requests.length?state.requests.map(n=>`<div class="mini-member">${avatar(n)}<div><strong>${esc(n)}</strong></div></div><div class="button-row">${btn('Accept','accept-friend','small-btn',`data-name="${esc(n)}"`)}${btn('Decline','decline-friend','small-btn secondary',`data-name="${esc(n)}"`)}</div>`).join(''):'<p class="muted small" style="margin-top:14px">No pending requests.</p>'}<div class="divider"></div><p class="small muted">Connections do not reveal private honor, rank or game presence.</p></aside></div>`);}
  function showQueue(){if(variant==='formed')return shell(head('Your team was formed.','The session was created before the cancellation reached us.','QUEUE RECOVERY')+'<section class="card">'+note('Join your existing team','A second queue is not created.')+link('Open the sample team','team','secondary')+'</section>');return shell(`${head('Finding your kind of team.','We keep your party intact and look for compatible teammates.','MATCHMAKING')}${steps(1)}<div class="workspace"><section class="card center">${variant?note(variant==='offline'?'Connection interrupted':'Could not enter the queue',variant==='offline'?'We will reconcile your queue status before another attempt.':'Your party has not been submitted. You can try again.','warn'):''}<div class="radar" aria-hidden="true"><i></i><i></i><i></i><span class="radar-node">${esc(state.name.slice(0,2).toUpperCase())}</span></div><h2>${variant?'Let’s reconnect.':'A team worth waiting for.'}</h2><p class="muted" style="margin:14px auto;max-width:460px">Similar honor comes first, with compatible ranks, region and language. The honor range gradually broadens as you wait.</p><div class="row wrap" style="justify-content:center;margin:22px 0">${pill(state.region)}${pill(state.language)}${pill(state.rank)}${pill(state.party.length+' in your party')}</div>${btn('Cancel search','cancel-queue','secondary')}<p class="small muted" style="margin-top:16px">No live queue or wait estimate in this preview.</p>${demo('Advance the fictional scenario.',btn('Form sample team','form-team','small-btn'))}</section><aside class="card"><h3>While we look</h3><ol class="step-list" style="margin-top:20px"><li><span class="step-number">1</span><div><strong>Keep QGuard open</strong><p>Your team and party code will appear here.</p></div></li><li><span class="step-number">2</span><div><strong>Have VALORANT ready</strong><p>You will join the ordinary game party yourself.</p></div></li></ol></aside></div>`);}
  function roster(){return `<div class="roster"><div class="roster-row roster-heading"><span></span><span>PLAYER</span><span>DECLARED RANK</span><span>HONOR</span><span>LOBBY CHECK</span></div>${[{name:state.name,tag:state.name+'#DEMO',rank:state.rank,honor:'68.4'},...peers].map((p,i)=>`<div class="roster-row">${avatar(p.name)}<div><strong>${i===1?'<a class="link-inline" href="#profile?state=teammate">'+esc(p.name)+'</a>':esc(p.name)} ${i===0?'· You':''}</strong><div class="small muted">${esc(p.tag)}</div></div><span>${esc(p.rank)}</span><strong>${p.honor}</strong><span>${pill(i===0&&!state.joined?'Check in game':'Confirmed',i===0&&!state.joined?'':'accent')}</span></div>`).join('')}</div>`;}
  function showTeam(){const recipient=variant==='recipient',code=state.code||((variant==='code-ready'||recipient||variant==='ready')?'DEMO-5Q':''),joined=state.joined||variant==='ready';return shell(`${head('Your five is ready.','Meet in VALORANT, verify the roster, then play together.','SESSION QG–024',pill('Formed · sample','accent'))}${steps(2)}${variant==='no-show'?note('Rune has not acknowledged the lobby','Five minutes have passed. Your report is one of four required votes. '+btn('Confirm Rune has not arrived','no-show-vote','secondary small-btn'),'warn'):variant==='acknowledge'?note('Your team is waiting for you','All four teammates reported you missing. Acknowledge within the 30-second window to cancel this request. '+btn('I’m here · acknowledge','acknowledge-show','small-btn')+demo('Frozen deadline scenario; no real timer.',link('Review expired outcome','disbanded?state=no-show','small-btn secondary')),'warn'):''}${variant==='offline'?note('Reconnecting to your team','Sending and membership changes are paused. Your last known team is shown.','warn'):''}<div class="stack"><div class="workspace"><div class="stack"><section class="card"><div class="card-head"><h2>${recipient?'Join the game party':'You are the party host'}</h2>${pill('01 / HANDOFF')}</div>${code?`<div class="party-code"><div><div class="metric-label">VALORANT PARTY CODE</div><strong id="party-code-text">${esc(code)}</strong></div>${btn('Copy code','copy-code','secondary',`data-code="${esc(code)}"`)}</div><p class="muted small" style="margin-top:14px">In VALORANT, open Party Code, paste this code, then choose Join Party. This preview does not connect to the game.</p>${!recipient?btn('Replace code','replace-code','ghost small-btn'):''}`:`<p class="muted small" style="margin-bottom:20px">Open an ordinary Competitive party in VALORANT. Generate its party code and enter it here for your four teammates.</p><form data-form="code" novalidate>${field('Party code','party-code','text','','placeholder="Enter a sample code" maxlength="80" autocomplete="off"')}${errorSlot()}<button class="btn">Share with my team</button></form>`}<div class="divider"></div><h3>Check accounts and ranks in the game</h3><p class="muted small" style="margin:10px 0 16px">Compare the roster below with your game lobby. If something does not match, ask your teammates to check.</p><div class="button-row">${btn(joined?'Lobby checked ✓':'I’m in the lobby · details match','lobby-check',joined?'secondary':'',!code?'disabled':'')}${link('Report an account / rank mismatch','discrepancy','ghost')}</div></section><section class="card"><div class="card-head"><h2>Meet your teammates</h2><span class="small muted">Europe · English · Competitive</span></div>${roster()}<p class="small muted" style="margin-top:14px">Honor is the snapshot used when this team formed. Lobby confirmations are player declarations, not a game sensor.</p></section><section class="card"><div class="row between"><div><h3>Done playing together?</h3><p class="muted small" style="margin-top:8px">End your participation and leave teammate feedback.</p></div>${btn('End my session','end-session','secondary',!joined?'disabled':'')}</div><div class="divider"></div><a class="small link-inline" href="#disbanded?state=no-show">Review the no-show outcome</a></section></div><section class="card"><div class="card-head"><h3>Team text</h3>${pill('Private')}</div><div class="chat-log" aria-label="Team messages"><div class="chat-message"><strong>Mina</strong><p>Hey team. Ready when you are!</p><small>Sample message · 20:41</small></div><div class="chat-message"><strong>Vega</strong><p>Let’s check the roster once we’re all in.</p><small>Sample message · 20:42</small></div>${state.messages.map(m=>`<div class="chat-message own"><strong>${esc(state.name)}</strong><p>${esc(m)}</p><small>Local draft message</small></div>`).join('')}</div><form class="chat-form" data-form="chat"><label class="sr-only" for="message">Message your team</label><input id="message" name="message" maxlength="500" placeholder="Message your team…" ${variant==='offline'?'disabled':''}><button class="btn small-btn" ${variant==='offline'?'disabled':''}>Send</button></form><p class="small muted" style="margin-top:12px">Your team and cleared administrators can access session context. Voice is outside this version.</p></section></div></div>`);}
  function showDiscrepancy(){if(variant==='cleared')return shell(head('The roster check is complete.','All three eligible teammates confirmed the declared rank matches.','LOBBY INTEGRITY')+'<section class="card">'+note('No mismatch corroborated','You can continue the QGuard lobby flow.')+link('Return to team','team','secondary')+'</section>');return shell(`${head('Let’s check the same detail.','This pauses QGuard’s team flow until the discrepancy is resolved.','LOBBY INTEGRITY')}<div class="workspace"><section class="card">${note('Mina reported a rank discrepancy','Atlas declared Gold III. Check Atlas’s current rank in the VALORANT lobby.','warn')}<div class="row" style="margin:24px 0">${avatar('Atlas','large')}<div><h2>Atlas#DEMO</h2><p class="muted">Declared rank · Gold III</p></div></div>${variant==='excluded'?note('You do not cast a corroborating vote','The reporter and reported player are excluded from these responses.'):variant==='waiting'?note('Your response is saved','Waiting for the remaining eligible teammates. No response is assumed for them.'):`<h3>Is Gold III Atlas’s actual in-game rank?</h3><p class="muted small" style="margin:12px 0 20px">Check in the game before responding. Your answer is required to continue.</p><div class="button-row">${btn('Yes, the rank matches','deny-discrepancy','secondary')}${btn('No, the rank is different','confirm-discrepancy')}</div>`}<div class="divider"></div><p class="small muted">One additional teammate confirming a mismatch disbands this QGuard team, even if others disagree. It does not remove anyone from the game lobby or impose a penalty.</p>${link('Back to team context','team','ghost')}</section><aside class="card"><h3>Who responds?</h3><p class="muted small" style="margin-top:12px">The three teammates other than Mina and Atlas.</p><div class="divider"></div><p class="muted small">There is no abstain option. Timeout and unresolved cancellation details remain a review question.</p></aside></div>`);}
  function showDisbanded(){const noShow=variant==='no-show';return shell(`${head('This team has been disbanded.','You can return to matchmaking for another team.','SESSION ENDED')}<section class="card">${empty(noShow?'A teammate did not arrive.':'The declared details could not be confirmed.',noShow?'Sample outcome: the five-minute wait passed, all four other players agreed, and the absent player did not acknowledge within 30 seconds.':'A second teammate confirmed the reported account or rank discrepancy. We cannot guarantee the integrity of this QGuard team.',btn('Return to matchmaking','requeue'))}<div class="divider"></div><p class="small muted center">This changes the QGuard session only. No numeric ratings are required for this pre-play disband. No game party is changed.</p></section>`);}
  function showHistory(){return shell(`${head('Your sessions, all together.','Revisit your teammates and finish any feedback you owe.','SESSION HISTORY')}${variant==='empty'?`<section class="card">${empty('Your first session starts here.','Find a team and your session will appear here.',link('Find teammates','dashboard'))}</section>`:`<section class="card"><div class="card-head"><h2>Recent sessions</h2>${pill(debt()?'1 needs feedback':'Your activity')}</div><div class="table-wrap"><table><thead><tr><th>SESSION</th><th>TEAM</th><th>STATUS</th><th>YOUR FEEDBACK</th><th></th></tr></thead><tbody><tr><td><strong>QG–024</strong><small>Today · 20:41</small></td><td>VALORANT · Competitive<small>Mina, Atlas, Vega, Rune</small></td><td>${pill(state.ended?'Ended':'Sample session')}</td><td>${debt()?pill(remaining()+' ratings due','warning'):pill(state.ended?'Complete':'Available')}</td><td>${link('View session','session','small-btn secondary')}</td></tr><tr><td><strong>QG–023</strong><small>Yesterday · 21:12</small></td><td>VALORANT · Competitive<small>Five-player session</small></td><td>${pill('Ended')}</td><td>${pill('Complete','accent')}</td><td>${link('View session','session?state=complete','small-btn ghost')}</td></tr></tbody></table></div></section>`}`);}
  function descriptor(p,key,title,left,right){const d=state.drafts[p.id]?.[key];return `<div class="descriptor"><div class="row between"><label for="${p.id}-${key}">${title}</label><button type="button" class="text-button small" data-action="clear-descriptor" data-peer="${p.id}" data-key="${key}">Omit</button></div><input id="${p.id}-${key}" name="${key}" type="range" min="0" max="100" value="${d??50}" data-touched="${d!=null}" aria-describedby="${p.id}-${key}-status"><div class="range-labels"><span>${left}</span><span>${right}</span></div><p id="${p.id}-${key}-status" class="small muted descriptor-status">${d==null?'Not included · move the slider to add feedback.':'Included · '+d+' / 100'}</p></div>`;}
  function ratingCard(p,complete=false,excluded=false){const val=state.ratings[p.id]||(complete?8:null);return `<article class="card rating-card" id="rating-${p.id}"><div class="card-head"><div class="row">${avatar(p.name)}<div><h2>${p.name}</h2><p class="small muted">${p.tag}</p></div></div>${pill(excluded?'Same premade':val?'Submitted':'Required',val?'accent':'')}</div>${excluded?'<p class="muted small">You entered this session together. No honor or descriptive rating is collected.</p>':val?`<div class="row between"><div><div class="metric-label">YOUR SUBMITTED HONOR RATING</div><div class="metric">${val}<small>/ 10</small></div></div>${pill('Locked','accent')}</div><p class="small muted" style="margin-top:12px">Only you can see this sent-rating receipt. It cannot be edited.</p>`:`<form data-form="rating" data-peer="${p.id}" novalidate><fieldset class="rating-fieldset"><legend>Overall honor <span class="muted small">· required</span></legend><p class="small muted">How was this teammate’s conduct during your session?</p><div class="rating-options">${Array.from({length:10},(_,i)=>`<label><input type="radio" name="honor" value="${i+1}" ${state.drafts[p.id]?.honor===i+1?'checked':''}><span>${i+1}</span></label>`).join('')}</div><div class="range-labels"><span>Very poor</span><span>Excellent</span></div></fieldset><div class="divider"></div><h3>What are they like to play with?</h3><p class="small muted" style="margin:10px 0 18px">Optional descriptions. These do not affect honor or matchmaking. Leave either slider untouched to omit it.</p>${descriptor(p,'communication','Communication','Quiet','Talkative')}${descriptor(p,'style','Play style','Deliberate','Aggressive')}${errorSlot()}<button class="btn" type="submit">Submit rating for ${p.name}</button><p class="small muted" style="margin-top:12px">Submitted ratings are final.</p></form>`}</article>`;}
  function showSession(){const full=variant==='full-premade'||(!variant&&state.sessionType==='full-premade'),premade=variant==='premade',disbanded=variant==='disbanded',complete=variant==='complete',list=full||disbanded?[]:premade?peers.filter(p=>p.id!=='vega'):eligible(),due=complete?0:list.filter(p=>!state.ratings[p.id]&&!(variant==='partial'&&p.id==='mina')).length;return shell(`${head('A session worth reflecting on.','QG–024 · Today, 20:41 · Europe · English','SESSION HISTORY',pill(disbanded?'Disbanded':'Ended'))}<div class="session-banner"><div><h2>VALORANT · Competitive</h2><p class="muted small" style="margin-top:8px">${esc(state.name)}, Mina, Atlas, Vega and Rune</p></div><a class="small link-inline" href="#report">Report teammate conduct</a></div><div class="workspace"><div class="stack">${full||disbanded?`<section class="card">${empty('No ratings required.',full?'Everyone entered as one premade. There are no eligible teammates to rate.':'This team was disbanded before play. No numeric feedback is collected.',link('Back to matchmaking','dashboard'))}</section>`:`${note(due?'Finish your feedback before your next queue.':'Your feedback is complete.',due?'There is no deadline. Rate each eligible teammate below. You do not need to wait for anyone else.':'You can find another team whenever you are ready. Other players can still submit their feedback.',due?'warn':'')}${list.map(p=>ratingCard(p,complete||(variant==='partial'&&p.id==='mina'))).join('')}${premade?ratingCard(peers[2],false,true):peers.filter(p=>(state.premadeIds||[]).includes(p.id)).map(p=>ratingCard(p,false,true)).join('')}`}</div><aside class="stack feedback-summary"><section class="card"><div class="eyebrow">YOUR FEEDBACK</div><div class="metric">${full||disbanded?0:list.length-due}<small>/ ${list.length}</small></div><p class="small muted">${due?due+' teammate ratings remaining.':'All eligible teammate ratings submitted.'}</p><div class="divider"></div>${btn('Find my next team','find-next','full',due?'disabled':'')}<p class="small muted" style="margin-top:14px">Your own completion unlocks your next queue.</p></section><section class="card"><h3>Private by design.</h3><p class="small muted" style="margin-top:12px">Teammates cannot see who rated them or what individual scores they received.</p><div class="divider"></div><p class="small muted">Honor updates as eligible ratings arrive. There is no ten-minute cutoff.</p></section></aside></div>`);}
  function showReport(){return shell(`${head('Tell us what happened.','A private report about conduct during this session.','SESSION QG–024')}<div class="workspace"><section class="card">${state.reportSent||variant==='submitted'?`${empty('Your report is recorded.','Cleared administrators can review your report and session context.',link('Back to session','session'))}${note('No automatic punishment','Report review is separate from account penalties. This receipt does not mean a penalty was applied.')}`:`<form data-form="report" novalidate>${select('Teammate','target',peers.map(p=>p.name),'Atlas')}${select('What happened?','category',['Choose a category','Left the session early','Harmful or unsportsmanlike language'],'Choose a category')}<div class="field"><label for="report-context">Context for the reviewer</label><textarea id="report-context" name="context" maxlength="2000" placeholder="Describe what happened in this sample session."></textarea></div><p class="small muted">Your report is visible to cleared administrators. Do not include passwords or unrelated personal information.</p>${errorSlot()}<div class="button-row"><button class="btn">Submit report</button>${link('Cancel','session','secondary')}</div></form>`}</section><aside class="card"><h3>Different issue?</h3><p class="small muted" style="margin:12px 0">Account or rank mismatches before play use the lobby check, not a conduct report.</p>${link('See lobby check','discrepancy','secondary small-btn')}</aside></div>`);}
  function summaryScale(title,left,right,value){return `<div class="summary-scale"><div class="row between"><strong>${title}</strong>${pill('Descriptive only')}</div><div class="progress-track"><i style="width:${value}%"></i></div><div class="range-labels"><span>${left}</span><span>${right}</span></div></div>`;}
  function showProfile(){if(variant==='teammate')return shell(head('Meet Mina.','Authorized teammate snapshot from session QG–024.','MATCHED TEAMMATE')+'<div class="workspace"><section class="card">'+avatar('Mina','large')+'<h2 style="margin-top:16px">Mina#DEMO</h2><p class="muted">Gold II · Honor 69.2 at formation</p><div class="divider"></div>'+summaryScale('Communication','Quiet','Talkative',62)+summaryScale('Play style','Deliberate','Aggressive',55)+demo('Fictional pre-session summaries; no individual votes or reviewer names.')+'</section><aside class="card"><h3>Your current teammate</h3><p class="small muted" style="margin:12px 0">This view is available through your matched session, not public profile search.</p>'+link('Return to team','team','secondary')+'</aside></div>');return shell(`${head('The teammate you bring.','Your profile and private feedback summaries.','MY PROFILE')}<div class="workspace"><section class="card"><div class="row">${avatar(state.name,'large')}<div><h2>${esc(state.name)}</h2><p class="muted">${esc(state.name)}#DEMO · ${esc(state.region)}</p></div></div><div class="divider"></div>${variant==='new'?`<div class="metric-label">STARTING HONOR</div><div class="metric">50.0<small>/ 100</small></div><p class="small muted">Your honor develops as eligible teammate feedback arrives.</p>`:ratingSummary()}<div class="divider"></div><h3>How teammates describe you</h3>${variant==='new'?empty('Not enough feedback yet.','Descriptions will appear when enough teammates have contributed.'):summaryScale('Communication','Quiet','Talkative',68)+summaryScale('Play style','Deliberate','Aggressive',43)}<p class="small muted" style="margin-top:18px">Visible to you and your matched teammates. These descriptions never affect matching or honor.</p>${demo('Fixed fictional summaries. Aggregation and minimum reviewer count are proposals for the checkpoint.')}</section><aside class="card"><h3>Your identity</h3><p class="muted small" style="margin:12px 0 20px">Manage your handle, account connection and queue defaults.</p>${link('Edit settings','settings','secondary full')}<div class="divider"></div><p class="small muted">Individual received ratings and reviewer identities are never shown here.</p></aside></div>`);}
  function showSettings(){return shell(`${head('Your settings.','Keep your profile and matchmaking defaults up to date.','ACCOUNT')}<div class="workspace"><div class="stack"><form class="card" data-form="settings" novalidate><h2>Profile & defaults</h2><div class="divider"></div>${field('QGuard handle','handle','text',state.name,'maxlength="24"')}<div class="grid-2">${select('Game region','region',['Europe','North America','Asia Pacific'],state.region)}${select('Team language','language',['English','Türkçe','Español'],state.language)}</div>${variant==='queued'?note('You are currently queued','Cancel matchmaking before changing queue criteria.','warn'):''}${errorSlot()}<button class="btn" ${variant==='queued'?'disabled':''}>Save changes</button>${variant==='queued'?btn('Cancel queue first','cancel-queue','secondary'):''}</form><section class="card"><div class="card-head"><h2>Riot connection</h2>${pill(state.linked?'Sample linked':'Not linked')}</div><p class="muted small">${state.linked?esc(state.name)+'#DEMO':'Connect Riot before normal matchmaking.'}</p><div class="button-row">${link('Connection details','connect?state=linked','secondary')}${link('Review rank before queueing','rank','ghost')}</div></section></div><aside class="card"><h3>Account security</h3><p class="muted small" style="margin:12px 0 20px">Password and account access.</p>${link('Manage security','security','secondary full')}<div class="divider"></div><a class="small link-inline" href="#error?state=policy">Privacy and data review</a></aside></div>`);}
  function showSecurity(){return shell(`${head('Keep your account yours.','Account security for your QGuard identity.','SECURITY')}<div class="workspace"><form class="card" data-form="security" novalidate><h2>Change password</h2><div class="divider"></div>${field('Current password','current-password','password','','autocomplete="off"')}${field('New password','new-password','password','','autocomplete="off"')}${field('Confirm new password','confirm-password','password','','autocomplete="off"')}${errorSlot()}<button class="btn">Update password</button></form><section class="card"><h3>Sign out</h3><p class="small muted" style="margin:12px 0 20px">Leave this sample account. Your local demonstration progress remains until reset.</p>${link('Sign out of preview','login','secondary')}</section></div>`);}
  function showAdmin(){return shell(`${head('Review with context.','Cleared-administrator demonstration. No real reports are present.','REPORT INBOX')}${variant==='empty'?`<section class="card">${empty('You’re up to date.','No reports are waiting for review.')}</section>`:`<section class="card"><div class="card-head"><h2>Reports</h2>${pill(state.reviewed?'Reviewed':'Needs review',state.reviewed?'':'warning')}</div><div class="table-wrap"><table><thead><tr><th>CASE</th><th>SESSION</th><th>REPORTED PLAYER</th><th>CATEGORY</th><th></th></tr></thead><tbody><tr><td><strong>R–018</strong><small>Fictional case</small></td><td>QG–024</td><td>Atlas</td><td>Harmful language</td><td>${link('Review case','case','small-btn secondary')}</td></tr></tbody></table></div></section>`}${demo('Real administrator access must be enforced by the server. The catalog exposes this sample screen for review.')}`);}
  function showCase(){return shell(`${head('Report R–018.','Private evidence for a cleared reviewer.','ADMIN / QG–024',pill(state.reviewed?'Reviewed':'Needs review'))}<div class="workspace"><div class="stack">${variant==='stale'?note('This case changed while you were reviewing','Reload the latest evidence before saving a review.','warn'):''}<section class="card"><h2>Reported conduct</h2><div class="grid-2" style="margin-top:20px"><div><div class="metric-label">REPORTED PLAYER</div><strong>Atlas</strong></div><div><div class="metric-label">REPORTED BY</div><strong>Mina · sample</strong></div></div><div class="divider"></div><p>Harmful or unsportsmanlike language</p><blockquote class="evidence">“Repeated hostile remarks after a difficult round.”</blockquote><p class="small muted">Fictional report summary, not a verified finding.</p></section><section class="card"><h2>Session context</h2><div class="timeline"><div><strong>20:41 · Team formed</strong><p>Five players; solo entries.</p></div><div><strong>21:18 · First report</strong><p>Mina submitted a conduct report about Atlas.</p></div>${variant==='excluded'?'<div><strong>21:20 · Second distinct report</strong><p>Unapplied outgoing numeric ratings from Atlas are excluded. Earlier applied effects remain.</p></div>':''}<div><strong>21:26 · Participation ended</strong><p>Player-declared, not game-detected.</p></div></div><h3>Private team text</h3><blockquote class="evidence">Mina: Let’s reset and focus on the next round.<br>Atlas: Okay.</blockquote><p class="small muted">Context access is limited to cleared administrators. No voice recording exists.</p></section><form class="card" data-form="admin-note" novalidate><div class="field"><label for="admin-note">Internal review note</label><textarea id="admin-note" name="note" maxlength="2000"></textarea></div>${errorSlot()}<button class="btn secondary" ${variant==='stale'?'disabled':''}>Save internal note</button>${state.adminNotes.map(n=>`<blockquote class="evidence">${esc(n)}</blockquote>`).join('')}</form></div><aside class="card"><h3>Review status</h3><p class="muted small" style="margin:12px 0 20px">Marking reviewed records handling only. It does not punish a player or recalculate honor.</p>${btn(state.reviewed?'Reviewed ✓':'Mark reviewed','mark-reviewed','full',state.reviewed||variant==='stale'?'disabled':'')}<div class="divider"></div>${link('Back to inbox','admin','secondary full')}</aside></div>`);}
  function showError(){const data={denied:['This page is private.','You do not have access to this session.','dashboard','Back to matchmaking'],expired:['This invitation expired.','Ask the sender for a new invitation.','friends','Open connections'],offline:['You’re offline.','Reconnect before changing your session or queue state.','dashboard','Retry sample screen'],policy:['Policy details are still under review.','Retention, final privacy copy and launch obligations need their own approval before public use. This design is not a published policy.','settings','Back to settings']};const [title,desc,route,label]=data[variant]||['We could not find that page.','The link may be old, or the page may have moved.','dashboard','Back to matchmaking'];return shell(`${head(title,desc,'LET’S GET YOU BACK')}<section class="card">${empty(title,desc,link(label,route))}</section>`);}
  function showReview(){return shell(`${head('QGuard, ready to walk through.','A complete local design review with fictional players and no live services.','DESIGN CHECKPOINT',link('Start guest journey','login'))}<div class="grid-3"><section class="card"><div class="eyebrow">01 / STRUCTURE</div><h2>Wireframe</h2><p class="muted small" style="margin:12px 0">Review hierarchy and flow without color.</p>${btn('Use wireframe','theme-wire','secondary small-btn')}</section><section class="card"><div class="eyebrow">02 / EXPLORATION</div><h2>Night shift</h2><p class="muted small" style="margin:12px 0">An initial dark gaming direction.</p>${btn('Use concept','theme-concept','secondary small-btn')}</section><section class="card"><div class="eyebrow">03 / REFINEMENT</div><h2>Good company</h2><p class="muted small" style="margin:12px 0">A quieter, readable workspace for repeated use.</p>${btn('Use refined','theme-refined','small-btn')}</section></div><div class="divider"></div>${note('Review scope','Riot sign-in, game entry, peers, queue results and administrator access are simulated. No network requests are made. Game-code viability remains an owner-approved assumption until live testing.')}<div class="catalog-grid" style="margin-top:24px">${screens.filter(s=>s[0]!=='review').map(([route,title,description,variants],i)=>`<article class="catalog-card"><div class="eyebrow">D${String(i+1).padStart(2,'0')} / ${route}</div><h3><a href="#${route}">${title} ${icon('arrow')}</a></h3><p>${description}</p><div class="state-links"><a href="#${route}">Default</a>${variants.map(v=>`<a href="#${route}?state=${v}">${v.replaceAll('-',' ')}</a>`).join('')}</div></article>`).join('')}</div>`);}

  const renderers={review:showReview,welcome:showWelcome,login:showLogin,register:showRegister,verify:showVerify,forgot:showForgot,reset:showReset,setup:showSetup,connect:showConnect,dashboard:showDashboard,rank:showRank,party:showParty,friends:showFriends,queue:showQueue,team:showTeam,discrepancy:showDiscrepancy,disbanded:showDisbanded,history:showHistory,session:showSession,report:showReport,profile:showProfile,settings:showSettings,security:showSecurity,admin:showAdmin,case:showCase,error:showError};
  function render(){const [route,query='']=(location.hash.slice(1)||'review').split('?');page=renderers[route]?route:'error';variant=new URLSearchParams(query).get('state')||'';app.innerHTML=renderers[page]();document.title='QGuard · '+(screens.find(s=>s[0]===page)?.[1]||'Review');window.scrollTo(0,0);document.querySelector('#main')?.focus({preventScroll:true});}
  function theme(value){document.body.dataset.theme=value;document.querySelector('#theme').value=value;try{localStorage.setItem('qguard_design_theme',value);}catch{}}
  document.querySelector('#theme').addEventListener('change',e=>theme(e.target.value));
  function formError(form,message){const el=form.querySelector('.form-error');if(el){el.textContent=message;el.tabIndex=-1;el.focus();}}
  function startQueue(){if(debt()){go('session');return;}if(!state.linked){go('connect');return;}state.queueStarted=Date.now();save();go('queue');}
  let pendingRating=null;
  document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const action=el.dataset.action,name=el.dataset.name;
    if(action.startsWith('theme-')){theme(action.slice(6));return;}
    if(action==='skip-content'){document.querySelector('#main')?.focus();}
    else if(action==='reset-demo'){reset();go('review');render();toast('Fictional progress reset.');}
    else if(action==='guest'){reset();state.linked=false;save();go('setup');}
    else if(action==='verified')go('setup');
    else if(action==='resend')toast('Sample verification email requested. Nothing was sent.');
    else if(action==='sample-connect'){state.linked=true;save();go('dashboard');}
    else if(action==='find-match'){if(variant==='feedback-due'){state.owed=true;save();}if(variant==='unlinked'){state.linked=false;save();}go(debt()?'session':!state.linked?'connect':'rank');}
    else if(action==='retry-rank')go('rank?state=loading');
    else if(action==='show-rank')go('rank');
    else if(action==='invite-friend'){if(state.party.includes(name))toast('Already in your sample party.');else if(state.party.length>=5)toast('Your party is full.');else{state.party.push(name);state.partyReady=false;save();toast(name+' accepted the fictional invitation.');render();}}
    else if(action==='remove-friend'){state.friends=state.friends.filter(n=>n!==name);save();render();toast('Sample connection removed.');}
    else if(action==='accept-friend'||action==='decline-friend'){state.requests=state.requests.filter(n=>n!==name);if(action==='accept-friend'&&!state.friends.includes(name))state.friends.push(name);save();render();}
    else if(action==='accept-party'){state.party=[state.name,'Vega'];save();go('party');}
    else if(action==='decline-party')go('party');
    else if(action==='party-ready'){if(debt())go('session');else go('rank');}
    else if(action==='party-queue'){if(variant==='full'){state.party=[state.name,...peers.map(p=>p.name)];state.premadeIds=peers.map(p=>p.id);state.sessionType='full-premade';save();}if(!state.partyReady){toast('Confirm your rank before starting.');return;}if(state.party.length===5){state.code='';state.joined=false;state.ratings={};state.owed=false;save();go('team');}else startQueue();}
    else if(action==='leave-party'){modal('Leave this party?','As the owner, leaving disbands your sample premade. You can queue solo afterward.','Leave party','confirm-leave-party');}
    else if(action==='confirm-leave-party'){closeDialog();state.party=[state.name];state.partyReady=false;save();go('dashboard');}
    else if(action==='cancel-queue'){state.queueStarted=null;state.confirmed=false;save();go('dashboard');toast('Sample search cancelled.');}
    else if(action==='form-team'){state.code='';state.joined=false;state.ended=false;state.ratings={};state.drafts={};state.owed=false;state.premadeIds=peers.filter(p=>state.party.includes(p.name)).map(p=>p.id);state.sessionType=state.party.length===5?'full-premade':state.party.includes('Vega')?'premade':'solo';save();go('team');}
    else if(action==='copy-code'){try{await navigator.clipboard.writeText(el.dataset.code);toast('Party code copied.');}catch{toast('Copy unavailable. Select the displayed code and copy it manually.');}}
    else if(action==='replace-code'){state.code='';save();go('team');render();}
    else if(action==='lobby-check'){state.joined=true;save();render();toast('Your manual lobby confirmation is saved.');}
    else if(action==='end-session')modal('End your participation?','This opens your session feedback. It does not end the VALORANT game or anyone else’s participation.','End & rate teammates','confirm-end');
    else if(action==='confirm-end'){closeDialog();state.ended=true;state.owed=true;state.party=[state.name];state.partyReady=false;save();go('session');}
    else if(action==='confirm-discrepancy'){state.owed=false;state.ended=true;save();go('disbanded');}
    else if(action==='no-show-vote'){toast('Your sample vote is recorded. Three more votes are needed.');}
    else if(action==='acknowledge-show'){go('team');toast('Sample acknowledgment cancels the no-show request.');}
    else if(action==='deny-discrepancy')go('discrepancy?state=waiting');
    else if(action==='requeue'){state.confirmed=false;save();go('rank');}
    else if(action==='close-dialog')closeDialog();
    else if(action==='clear-descriptor'){const {peer,key}=el.dataset;state.drafts[peer]??={};delete state.drafts[peer][key];save();const input=document.getElementById(peer+'-'+key);input.value=50;input.dataset.touched='false';document.getElementById(peer+'-'+key+'-status').textContent='Not included · move the slider to add feedback.';}
    else if(action==='confirm-rating'&&pendingRating){const {peer,honor,descriptors}=pendingRating;if(!state.ratings[peer]){state.ratings[peer]=honor;state.descriptors[peer]=descriptors;}pendingRating=null;save();closeDialog();render();toast('Rating submitted and locked.');}
    else if(action==='find-next'){if(variant==='complete'||variant==='full-premade'||variant==='disbanded'){go('rank');return;}if(remaining()&&state.owed){toast('Finish every eligible rating first.');return;}state.owed=false;save();go('rank');}
    else if(action==='mark-reviewed'){state.reviewed=true;save();render();toast('Marked reviewed. No penalty or honor change.');}
  });
  document.addEventListener('input',e=>{const form=e.target.closest('form[data-form="rating"]');if(!form)return;const peer=form.dataset.peer;state.drafts[peer]??={};if(e.target.type==='radio')state.drafts[peer].honor=Number(e.target.value);if(e.target.type==='range'){const key=e.target.name;e.target.dataset.touched='true';state.drafts[peer][key]=Number(e.target.value);document.getElementById(peer+'-'+key+'-status').textContent='Included · '+e.target.value+' / 100';}save();});
  document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const data=Object.fromEntries(new FormData(form));const kind=form.dataset.form;const trim=k=>String(data[k]||'').trim();
    if(kind==='login'||kind==='register'||kind==='forgot'){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trim('email'))){formError(form,'Enter a valid sample email address.');return;}if(kind!=='forgot'&&!trim('password')){formError(form,'Enter a sample password.');return;}if(kind==='register'&&!trim('handle')){formError(form,'Choose a QGuard handle.');return;}if(kind==='register'){state.name=trim('handle');state.party=[state.name];save();go('verify');}else go(kind==='forgot'?'forgot?state=sent':'dashboard');}
    else if(kind==='setup'||kind==='settings'){if(!trim('handle')){formError(form,'Enter a QGuard handle.');return;}state.name=trim('handle');state.party[0]=state.name;state.region=data.region;state.language=data.language;save();if(kind==='setup')go('connect');else toast('Sample settings saved.');}
    else if(kind==='rank'){if(!data.confirmed){formError(form,'Confirm your current rank before continuing.');return;}state.rank=data.rank;state.confirmed=true;state.partyReady=true;save();if(state.party.length>1)go('party');else startQueue();}
    else if(kind==='friend'){const n=trim('friend-handle');if(!n){formError(form,'Enter an exact QGuard handle.');return;}if(n.toLowerCase()===state.name.toLowerCase()||state.friends.some(f=>f.toLowerCase()===n.toLowerCase())){formError(form,'Choose someone who is not already a connection or yourself.');return;}if(![...peers.map(p=>p.name),'Demo'].some(f=>f.toLowerCase()===n.toLowerCase())){formError(form,'No sample player has that exact handle. Try Rune.');return;}if(state.outgoing.some(f=>f.toLowerCase()===n.toLowerCase())){formError(form,'A request to this sample player is already pending.');return;}state.outgoing.push(n);save();render();toast('Fictional request created. Nothing sent.');}
    else if(kind==='code'){if(!trim('party-code')){formError(form,'Enter a party code to share.');return;}state.code=trim('party-code');save();render();toast('Sample code shared with the fictional team.');}
    else if(kind==='chat'){if(trim('message')){state.messages.push(trim('message'));save();render();document.querySelector('#message')?.focus();}}
    else if(kind==='rating'){if(!data.honor){formError(form,'Choose an overall honor rating from 1 to 10.');return;}const peer=form.dataset.peer;const descriptors={};for(const key of ['communication','style'])if(form.elements[key].dataset.touched==='true')descriptors[key]=Number(data[key]);pendingRating={peer,honor:Number(data.honor),descriptors};modal('Submit your rating for '+peers.find(p=>p.id===peer).name+'?',`Overall honor: ${data.honor} / 10. ${Object.keys(descriptors).length} optional descriptions included. You cannot change this rating after submitting.`,'Submit & lock rating','confirm-rating');}
    else if(kind==='report'){if(data.category==='Choose a category'){formError(form,'Choose a report category.');return;}if(!trim('context')){formError(form,'Add a little context for the reviewer.');return;}state.reportSent=true;save();render();}
    else if(kind==='admin-note'){if(!trim('note')){formError(form,'Write an internal note first.');return;}state.adminNotes.push(trim('note'));save();render();toast('Internal sample note saved.');}
    else if(kind==='password'||kind==='security'){if(kind==='security'&&!trim('current-password')){formError(form,'Enter your sample current password.');return;}if(!trim('new-password')||data['new-password']!==data['confirm-password']){formError(form,'Enter matching new sample passwords.');return;}form.reset();toast('Sample password change complete. No password was stored.');if(kind==='password')go('login');}
  });
  window.addEventListener('hashchange',render);
  let selectedTheme='refined';try{selectedTheme=localStorage.getItem('qguard_design_theme')||'refined';}catch{}
  theme(['wire','concept','refined'].includes(selectedTheme)?selectedTheme:'wire');
  render();
})();
