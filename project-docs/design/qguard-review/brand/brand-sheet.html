dalone Q"><img src="favicon.svg" width="80" height="80" alt="QGuard app icon"></div><figcaption>STANDALONE MARK · Favicon / app icon</figcaption></figure></div><p class="caption">Outlined SVG artwork. Fixed spacing. No font download required. Monochrome and white variants included.</p></main></body></html>
